<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="121.8" version="1.1" width="173.6" viewBox="-4 -4 124 87">
  <title>x and y aren’t magically linked</title>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #1f2937; }
    .name { fill: #f1f5f9; stroke: #475569; stroke-width: 1.25; }
    .value { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.5; }
    .list { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.25; }
    .arrow { fill: none; stroke: #64748b; stroke-width: 1.5; }
    .arrowend path { fill: #64748b; }
    marker circle { fill: #475569; }
    .frame { fill: none; stroke: #94a3b8; stroke-width: 1.25; }
    .framelabel { fill: #64748b; font-size: 12px; font-style: italic; }
    .top_code { fill: #0f172a; font-weight: 600; }
  </style>
  <defs>
    <marker class="arrowend" id="id3" markerHeight="10" markerWidth="10" orient="auto" refX="10" refY="5" viewBox="0,0,10,10">
      <path d="M 0,0 L 10,5 L 0,10 L 1,5 z"></path>
    </marker>
  </defs>
  <g transform="translate(-81.0,-13.0)">
    <polygon class="name" points="83,15 115,15 120,30 115,45 83,45"></polygon>
    <text dy=".3em" text-anchor="middle" x="99.625" y="30">x</text>
    <polygon class="name" points="83,60 115,60 120,75 115,90 83,90"></polygon>
    <text dy=".3em" text-anchor="middle" x="99.625" y="75">y</text>
    <circle class="int value" cx="180" cy="30" r="15"></circle>
    <text dy=".3em" text-anchor="middle" x="180" y="30">12</text>
    <circle class="int value" cx="180" cy="75" r="15"></circle>
    <text dy=".3em" text-anchor="middle" x="180" y="75">23</text>
    <path class="arrow" d="M 120,30 C 131,30 131,30 142,30 C 153,30 153,30 165,30" fill="none" marker-end="url(#id3)"></path>
    <path class="arrow" d="M 120,75 C 131,75 131,75 142,75 C 153,75 153,75 165,75" fill="none" marker-end="url(#id3)"></path>
  </g>
</svg>
